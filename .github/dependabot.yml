version: 2
updates:
  # Keeps the commit-pinned actions current; one grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The development dependencies (the package has no runtime dependencies), pinned
  # exactly in package.json; one grouped pull request a month.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-development:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # ts-jest supports TypeScript below 7 (its peer range): a major update cannot install until it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types of the oldest Node.js the package supports (engines: >=22), so it uses nothing newer.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
