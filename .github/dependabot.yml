version: 2
updates:
  # Keeps the commit-pinned actions current; one grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The development dependencies (the package has no runtime dependencies), pinned
  # exactly in package.json; one grouped pull request a month.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-development:
        dependency-type: development
        patterns: ["*"]
