name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:version

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Build (ESM + CJS + types)
        run: npm run build

      - name: Check package entry points
        run: npm run test:package

      - name: Run tests
        run: npm test

  sdk-e2e:
    name: SDK against core main
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: gm_sdk_ha
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genesis -d gm_sdk_ha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "./core[postgres]"
      - name: Install nginx (load balancer for the HA test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx
          sudo systemctl stop nginx || true
      - name: Run SDK lifecycle and HA failover interoperability tests
        run: npm run test:e2e
        env:
          GM_E2E_PYTHON: python
          GM_E2E_HA_DATABASE_URL: postgresql://genesis:genesis@localhost:5432/gm_sdk_ha

  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=main" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              if [ "$version" != "$core" ] && ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::Release $version is not a Genesis Mesh core version (core is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"
