name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (the Genesis Mesh core is tagged first)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
              exit 1
            fi
            # The SDK publishes a version only once the core has released it: the core's tag
            # v$version must exist and name the same version. The core's main is not enough:
            # it says $version from the release merge on, before the core is tagged.
            if ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
              echo "::error::The Genesis Mesh core is not tagged v$version. Release the core first; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches files for minutes.
            ref="$(jq -rn --arg ref "v$version" '$ref|@uri')"
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=$ref" | tr -d '[:space:]')"
            if [ "$core" != "$version" ]; then
              echo "::error::The core's tag v$version holds version $core, not $version."
              exit 1
            fi
            echo "Release train verified: $version (core tag v$version)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: npm run check:version
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) p = 1; next } p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Coordinated Genesis Mesh $tag release." > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
